# Keeps عالشباك's showtimes fresh: scrape the cinemas, match films to TMDB,
# upload to Supabase. VOX's presales every 10 minutes (about a minute of
# polite paging, so a new release's booking shows up fast); Renaissance and
# Scene every 30; elCinema (VOX's week + the smaller cinemas, ~11 min) hourly.

name: Showtimes pipeline

on:
  schedule:
    # Avoid the busiest minute boundaries; GitHub schedules remain best-effort.
    - cron: "3,13,23,33,43,53 * * * *"
  workflow_dispatch:
    inputs:
      sources:
        description: "Sources to scrape (space-separated; empty = all)"
        required: false
        default: ""

# Never two runs at once: a slow run finishes before the next starts.
concurrency:
  group: showtimes-pipeline
  cancel-in-progress: false

jobs:
  pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: scraper
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
      SCRAPER_CONTACT: ${{ secrets.SCRAPER_CONTACT }}
      # Optional: without it the run skips push notifications.
      FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: scraper/package-lock.json

      - run: npm ci

      # No browser to install: Premiere, the one source that needs it, blocks
      # these servers (the app reads it on the phone).

      # TMDB lookups are cached for a week; keep the cache between runs.
      - name: Restore TMDB cache
        uses: actions/cache/restore@v4
        with:
          path: scraper/data/tmdb-cache.json
          key: tmdb-cache-${{ github.run_id }}
          restore-keys: tmdb-cache-

      - name: Pick sources
        id: sources
        run: |
          # Scheduled runs start a few minutes late, so go by the 10-minute slot.
          slot=$(( 10#$(date -u +%M) / 10 ))
          if [ -n "${{ github.event.inputs.sources }}" ]; then
            echo "list=${{ github.event.inputs.sources }}" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ] || [ "$slot" -eq 0 ]; then
            # First slot of the hour: everything. Premiere's own site blocks
            # these servers; the app reads Premiere on the phone instead.
            echo "list=renaissance scene elcinema vox" >> "$GITHUB_OUTPUT"
          elif [ "$slot" -eq 3 ]; then
            echo "list=renaissance scene vox" >> "$GITHUB_OUTPUT"
          else
            echo "list=vox" >> "$GITHUB_OUTPUT"
          fi

      - name: Scrape and sync
        run: npm run pipeline -- ${{ steps.sources.outputs.list }}

      - name: Save TMDB cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: scraper/data/tmdb-cache.json
          key: tmdb-cache-${{ github.run_id }}

      # Scrape output and warnings, for looking into a bad run.
      - name: Keep the scrape output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scrape-output
          path: scraper/out/
          retention-days: 3
