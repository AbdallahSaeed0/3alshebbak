# Keeps عالشباك's showtimes fresh: scrape the cinemas, match films to TMDB,
# upload to Supabase. VOX's presales every 10 minutes (about a minute of
# polite paging, so a new release's booking shows up fast); Renaissance and
# Scene every 30; elCinema (VOX's week + the smaller cinemas, ~11 min) hourly.

name: Showtimes pipeline

on:
  # Supabase Cron dispatches this every 10 minutes; see scraper/README.md.
  workflow_dispatch:
    inputs:
      sources:
        description: "Sources to scrape (space-separated; empty = all)"
        required: false
        default: ""

# Never two runs at once: a slow run finishes before the next starts.
concurrency:
  group: showtimes-pipeline
  cancel-in-progress: false

jobs:
  pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: scraper
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
      SCRAPER_CONTACT: ${{ secrets.SCRAPER_CONTACT }}
      # Optional: without it the run skips push notifications.
      FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      CINEMA_FETCH_URL: https://enmcbbwunzhjxgwehzuf.supabase.co/functions/v1/cinema-fetch
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: scraper/package-lock.json

      - run: npm ci

      - name: Configure independent pipeline watchdog
        run: npx tsx src/configure-watchdog.ts

      # TMDB lookups are cached for a week; keep the cache between runs.
      - name: Restore TMDB cache
        uses: actions/cache/restore@v4
        with:
          path: scraper/data/tmdb-cache.json
          key: tmdb-cache-${{ github.run_id }}
          restore-keys: tmdb-cache-

      - name: Pick sources
        id: sources
        env:
          REQUESTED_SOURCES: ${{ inputs.sources }}
        run: |
          if [ -n "$REQUESTED_SOURCES" ]; then
            for source in $REQUESTED_SOURCES; do
              case "$source" in
                renaissance|scene|elcinema|vox|premiere) ;;
                *) echo "Unknown source: $source"; exit 1 ;;
              esac
            done
            # Normalize whitespace before passing the allowlisted names on.
            echo "list=$(echo $REQUESTED_SOURCES)" >> "$GITHUB_OUTPUT"
          else
            echo "list=renaissance scene elcinema vox premiere" >> "$GITHUB_OUTPUT"
          fi

      - name: Install Premiere browser
        if: contains(steps.sources.outputs.list, 'premiere')
        run: npx playwright install --with-deps chromium

      - name: Scrape and sync
        run: npm run pipeline -- ${{ steps.sources.outputs.list }}

      - name: Save TMDB cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: scraper/data/tmdb-cache.json
          key: tmdb-cache-${{ github.run_id }}

      # Scrape output and warnings, for looking into a bad run.
      - name: Keep the scrape output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scrape-output
          path: scraper/out/
          retention-days: 3
