name: shebbak
description: "A new Flutter project."
publish_to: 'none'
version: 0.2.5+8

environment:
  sdk: ^3.11.1

dependencies:
  firebase_core: ^5.1.0
  firebase_messaging: ^17.0.1
  flutter:
    sdk: flutter
  flutter_inappwebview: ^6.1.5
  flutter_native_splash: ^2.4.7
  flutter_localizations:
    sdk: flutter
  flutter_map: ^8.3.2
  geolocator: ^14.1.2
  google_fonts: ^8.2.1
  home_widget: ^0.10.0
  html: ^0.15.7
  http: ^1.6.0
  image_picker: ^1.2.4
  latlong2: ^0.10.1
  path_provider: ^2.1.6
  share_plus: ^13.3.1
  shared_preferences: ^2.5.6
  url_launcher: ^6.3.3
  workmanager: ^0.10.10
  package_info_plus: ^10.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/data/
    # Copied from scraper/src/sources/premiere.page.js; keep the two the same.
    - assets/premiere/

# App icon and native splash, from assets/brand/ (rendered by
# scraper/scripts/render-brand.mjs). Regenerate with:
#   dart run flutter_launcher_icons && dart run flutter_native_splash:create
flutter_launcher_icons:
  image_path: assets/brand/icon.png
  android: true
  ios: true
  remove_alpha_ios: true
  adaptive_icon_background: "#0B0A08"
  adaptive_icon_foreground: assets/brand/icon-foreground.png
  adaptive_icon_monochrome: assets/brand/icon-monochrome.png
  web:
    generate: true
    image_path: assets/brand/icon.png
    background_color: "#0B0A08"
    theme_color: "#0B0A08"

flutter_native_splash:
  color: "#0B0A08"
  image: assets/brand/splash-legacy.png
  android_12:
    color: "#0B0A08"
    image: assets/brand/splash.png
  web: true
