<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<style>
:root{--bg:#0b0a08;--panel:rgba(22,19,15,.88);--edge:rgba(255,255,255,.09);--text:#f5efe6;--muted:#a39a8c;--gold:#f2b544;--on-gold:#1a1206}
html,body{margin:0;height:100%;background:var(--bg);overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
*{box-sizing:border-box}
.cx{position:relative;width:100%;height:100%;overflow:hidden;color:var(--text);font-family:"IBM Plex Sans Arabic","Noto Sans Arabic",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased;outline:none}
#gl{position:absolute;inset:0;display:block;width:100%;height:100%;touch-action:none;cursor:grab}
.panel{background:var(--panel);border:1px solid var(--edge);border-radius:16px;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);box-shadow:0 12px 40px rgba(0,0,0,.45)}
.eyebrow{margin:0 0 4px;font-size:11px;letter-spacing:.06em;color:var(--muted);font-weight:600}
.info{position:absolute;top:16px;right:16px;width:340px;padding:18px;display:flex;flex-direction:column;gap:14px;max-height:calc(100% - 32px);overflow:auto}
.info-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.info-title{margin:0;font-size:24px;font-weight:700;line-height:1.15}
.badge{flex:none;margin-top:16px;padding:5px 10px;border-radius:999px;border:1px solid;font-size:12px;font-weight:700;white-space:nowrap;background:rgba(255,255,255,.03)}
.actions{display:flex;gap:12px;align-items:flex-end}
.view-col{flex:1;display:flex;flex-direction:column;gap:8px;min-width:0}
.row2{display:flex;flex-direction:column;gap:4px}
.row2 .btn{justify-content:flex-start}
.btn{appearance:none;border:1px solid rgba(255,255,255,.13);background:rgba(255,255,255,.06);color:var(--text);font:inherit;font-size:14px;font-weight:600;border-radius:12px;min-height:44px;padding:0 12px;display:inline-flex;align-items:center;justify-content:center;gap:8px;cursor:pointer;transition:background .2s,transform .1s;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.btn:active{transform:scale(.97);background:rgba(255,255,255,.12)}
.btn:disabled{opacity:.4}
.btn-primary{background:var(--gold);border-color:var(--gold);color:var(--on-gold);font-size:15px;font-weight:700;min-height:50px}
.btn-primary:active{background:#ffc764}
.btn svg{width:18px;height:18px;flex:none}
.dpad{direction:ltr;display:grid;grid-template-columns:repeat(3,44px);grid-template-rows:repeat(2,44px);gap:4px;flex:none}
.dpad .btn{padding:0;width:44px;border-radius:10px}
.d-up{grid-column:2;grid-row:1}.d-left{grid-column:1;grid-row:2}.d-down{grid-column:2;grid-row:2}.d-right{grid-column:3;grid-row:2}
.map{position:absolute;left:16px;bottom:16px;width:236px;padding:12px;direction:ltr}
.mbox{position:relative;width:100%}
.mscreen{position:absolute;height:3px;border-radius:2px;background:#cfe0ff;box-shadow:0 0 10px rgba(160,200,255,.85);transform:translateY(-50%)}
.mcone{position:absolute;left:0;top:0;width:100%;height:100%;pointer-events:none}
.mseat{position:absolute;transform:translate(-50%,-50%);border:0;padding:0;border-radius:1.5px;background:#5f6573;cursor:pointer}
.mseat::before{content:'';position:absolute;inset:-3px -1px}
.mseat.is-hover{background:#9cc0ff}
.mseat.is-sel{background:var(--gold);box-shadow:0 0 0 2px rgba(242,181,68,.35),0 0 10px rgba(242,181,68,.9)}
.pip{position:absolute;right:16px;bottom:16px;width:304px;height:171px;border-radius:6px;border:1px solid rgba(255,255,255,.22);background:transparent;padding:0;cursor:pointer;color:var(--text);font:inherit;box-shadow:0 0 0 6px rgba(11,10,8,.6),0 16px 40px rgba(0,0,0,.5)}
.pip-label{position:absolute;inset-inline-start:8px;top:8px;font-size:11px;font-weight:700;padding:4px 8px;border-radius:999px;background:rgba(11,10,8,.75)}
.pip-cta{position:absolute;inset-inline-end:8px;bottom:8px;display:flex;align-items:center;gap:4px;font-size:11px;font-weight:700;padding:4px 8px;border-radius:999px;background:rgba(11,10,8,.75)}
.pip-cta svg{width:12px;height:12px}
.tip{position:absolute;transform:translate(-50%,calc(-100% - 10px));pointer-events:none;padding:8px 12px;border-radius:10px;background:rgba(11,10,8,.94);border:1px solid rgba(255,255,255,.14);font-size:12px;display:flex;flex-direction:column;gap:2px;white-space:nowrap}
.tip span{color:var(--muted)}
.overlay-msg{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:14px;pointer-events:none}
[hidden]{display:none!important}
@media (max-height:760px) and (min-width:761px){.pip{width:224px;height:126px}}
@media (max-width:760px){
.map{top:10px;right:10px;left:auto;bottom:auto;width:120px;padding:8px}
.info{top:auto;left:8px;right:8px;bottom:8px;width:auto;padding:14px;gap:12px;max-height:60%}
.info-title{font-size:20px}
.badge{margin-top:14px}
.info .info-head{margin-bottom:-4px}
.pip{top:10px;left:10px;right:auto;bottom:auto;width:160px;height:90px}
}
</style>
</head>
<body>
<div class="cx" id="root" tabindex="0">
  <canvas id="gl"></canvas>
  <div class="overlay-msg" id="loading"></div>

  <nav class="panel map" id="map" hidden>
    <div class="mbox" id="mbox">
      <div class="mscreen" id="mscreen"></div>
      <svg class="mcone" id="mcone" preserveAspectRatio="none" aria-hidden="true"><polygon id="mpoly" fill="rgba(242,181,68,0.24)"></polygon></svg>
    </div>
  </nav>

  <button class="pip" id="pip" hidden>
    <span class="pip-label" id="pipLabel"></span>
    <span class="pip-cta"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 3h6v6"/><path d="M9 21H3v-6"/><path d="M21 3l-7 7"/><path d="M3 21l7-7"/></svg><span id="pipCta"></span></span>
  </button>

  <div class="tip" id="tip" hidden><strong id="tipT"></strong><span id="tipS"></span></div>

  <section class="panel info" id="info" hidden>
    <div class="info-head">
      <div>
        <p class="eyebrow" id="eyebrow"></p>
        <h2 class="info-title" id="title"></h2>
      </div>
      <span class="badge" id="badge"></span>
    </div>
    <button class="btn btn-primary" id="book" hidden>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 9a2 2 0 0 0 0 4v4a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-4a2 2 0 0 0 0-4V5a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2z"/><path d="M13 3v2"/><path d="M13 17v2"/><path d="M13 10v2"/></svg>
      <span id="bookT"></span>
    </button>
    <div class="actions">
      <div class="view-col">
        <div class="row2">
          <button class="btn" id="view">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>
            <span id="viewT"></span>
          </button>
          <button class="btn" id="best"><span id="bestT"></span></button>
        </div>
      </div>
      <div class="dpad" role="group" id="dpad">
        <button class="btn d-up" id="goFwd"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 15l6-6 6 6"/></svg></button>
        <button class="btn d-left" id="goLeft"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg></button>
        <button class="btn d-down" id="goBack"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg></button>
        <button class="btn d-right" id="goRight"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg></button>
      </div>
    </div>
  </section>
</div>
<script src="three.min.js"></script>
<script>
// عالشباك — the hall in 3D, the seat explorer (lib/screens/seat_view_screen.dart).
// Flutter sends the hall once with setupHall(json): every position and every
// rating is worked out in Dart (lib/data/halls.dart), in metres: x across the
// hall (right as you face the screen), y up, z back from the screen wall.
// The page tells Flutter which seat is picked ('seat') and when to open the
// booking site ('book').
(() => {
  'use strict';
  const VIEW = { OVERVIEW_FOV: 50, SEAT_FOV: 58, TWEEN_MS: 1100, STEP_MS: 650 };
  const COLORS = { available: 0x737b8e, hover: 0xa8c8ff, selected: 0xf2b544 };
  const TONE = { good: '#5bd6a6', ok: '#f0d878', bad: '#ff8a78' };
  // Up to 1.5x resolution (2x costs ~80% more for little visible gain), 1x if
  // frames run slow; IDLE_FPS while nothing moves; the corner preview redrawn
  // every PIP_REFRESH_MS rather than every frame.
  const QUALITY = { SHADOW_MAP: 1024, MAX_PIXEL_RATIO: 1.5, IDLE_FPS: 30, PIP_REFRESH_MS: 250 };
  const EYE_HEIGHT = 1.15;
  const SIDE_AISLE = 1.3, BACK_SPACE = 2.3;
  const $ = (id) => document.getElementById(id);
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const send = (name, ...args) => { try { window.flutter_inappwebview && window.flutter_inappwebview.callHandler(name, ...args); } catch (e) { /* not in the app */ } };

  let H = null;   // the hall, as Flutter sent it
  let L = null;   // derived layout
  let TXT = {};

  function buildLayout(h) {
    const seats = h.seats.map((s, i) => ({
      i: i, id: s.id, rowL: s.row, num: s.num, depth: s.d, col: s.c,
      x: s.x, z: s.z, floor: s.y, rating: s.r, tone: s.k
    }));
    const depths = h.depths, columns = h.columns;
    const byDepth = []; for (let d = 0; d < depths; d++) byDepth.push([]);
    seats.forEach((s) => byDepth[s.depth].push(s));
    byDepth.forEach((r) => r.sort((a, b) => a.col - b.col));
    const blockHalf = columns * h.seatWidth / 2;
    const HW = blockHalf + SIDE_AISLE;
    const backZ = h.firstRow + (depths - 1) * h.rowDepth + h.rowDepth / 2 + BACK_SPACE;
    const screenH = h.screen.h;
    const screenY = h.screen.bottom + screenH / 2;
    const screenTop = h.screen.bottom + screenH;
    const hallHeight = Math.max(8.5, screenTop + 1.6, (depths - 1) * h.rise + 4);
    const used = new Set(seats.map((s) => s.col));
    const aisles = [];
    let run = null;
    for (let col = 0; col <= columns; col++) {
      const empty = col < columns && !used.has(col);
      if (empty) { if (!run) run = { a: col, b: col }; else run.b = col; }
      else if (run) {
        if (run.a > 0 && run.b < columns - 1) aisles.push({ x: ((run.a + run.b) / 2 - (columns - 1) / 2) * h.seatWidth, w: (run.b - run.a + 1) * h.seatWidth * 0.8 });
        run = null;
      }
    }
    aisles.push({ x: -(blockHalf + SIDE_AISLE / 2), w: SIDE_AISLE * 0.75 });
    aisles.push({ x: blockHalf + SIDE_AISLE / 2, w: SIDE_AISLE * 0.75 });
    return { seats, byDepth, depths, columns, blockHalf, HW, backZ, screenH, screenY, screenTop, hallHeight, aisles, mapZ0: -0.9, mapW: 2 * HW, mapH: backZ + 0.9 };
  }

  class Explorer {
    constructor() {
      this.state = { sel: null, hover: null, tipX: 0, tipY: 0, mode: 'orbit' };
      this.sel = null; this.hover = null; this.mode = 'orbit';
      ['loop', 'onKey', 'onDown', 'onMove', 'onUp', 'onWheel', 'onLeave'].forEach((k) => { this[k] = this[k].bind(this); });
    }

    setState(p) { Object.assign(this.state, p); this.render(); }

    /* ---------------- setup ---------------- */
    init() {
      const T = THREE;
      this.T = T;
      this.canvas = $('gl');
      this.root = $('root');
      const renderer = new T.WebGLRenderer({ canvas: this.canvas, antialias: true, powerPreference: 'high-performance' });
      renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, QUALITY.MAX_PIXEL_RATIO));
      renderer.toneMapping = T.ACESFilmicToneMapping;
      renderer.toneMappingExposure = 1.15;
      renderer.setClearColor(0x050405, 1);
      renderer.shadowMap.enabled = true;
      renderer.shadowMap.type = T.PCFShadowMap;
      renderer.shadowMap.autoUpdate = false; // nothing moves: shadows are drawn once
      this.renderer = renderer;
      this.buildEnv();
      this.camera = new T.PerspectiveCamera(VIEW.OVERVIEW_FOV, 1, 0.05, 300);
      this.pipCam = new T.PerspectiveCamera(VIEW.SEAT_FOV, 16 / 9, 0.05, 300);
      this.look = new T.Vector3();
      this.orb = { target: new T.Vector3(), r: 26, theta: 0.62, phi: 0.95 };
      this.seatCam = { eye: new T.Vector3(), yaw: 0, pitch: 0, baseYaw: 0 };
      this.fov = VIEW.OVERVIEW_FOV;
      this.tween = null;
      this.raycaster = new T.Raycaster();
      this.ndc = new T.Vector2();
      this.tmp = new T.Vector3();
      this.tmpColor = new T.Color();
      this.pointers = new Map();
      this.size = { w: 1, h: 1 };
      this.scene = new T.Scene();
      this.buildScene();
      this.buildMap();
      this.resize();
      new ResizeObserver(() => this.resize()).observe(this.root);

      const c = this.canvas;
      c.addEventListener('pointerdown', this.onDown);
      c.addEventListener('pointermove', this.onMove);
      c.addEventListener('pointerup', this.onUp);
      c.addEventListener('pointercancel', this.onUp);
      c.addEventListener('pointerleave', this.onLeave);
      c.addEventListener('wheel', this.onWheel, { passive: false });
      c.addEventListener('contextmenu', (e) => e.preventDefault());
      this.root.addEventListener('keydown', this.onKey);
      $('book').addEventListener('click', () => { if (this.sel != null) send('book', L.seats[this.sel].id); });
      $('view').addEventListener('click', () => this.toggleView());
      $('pip').addEventListener('click', () => this.enterSeat());
      $('best').addEventListener('click', () => this.select(H.best));
      $('goFwd').addEventListener('click', () => this.step(-1, 0));
      $('goBack').addEventListener('click', () => this.step(1, 0));
      $('goLeft').addEventListener('click', () => this.step(0, -1));
      $('goRight').addEventListener('click', () => this.step(0, 1));

      // drift in from further out, onto the starting seat
      const def = this.defaultView();
      this.camera.position.copy(this.orbitPos(def.target, def.r * 1.45, def.theta + 0.55, def.phi - 0.2));
      this.look.copy(def.target);
      this.camera.lookAt(this.look);
      this.select(H.start != null ? H.start : H.best, 2000);
      // Draw once now: every shader compiles and the shadows are drawn here,
      // while the page may still be hidden (built ahead from the ticket),
      // not on the first frame the person sees.
      this.updateCamera(performance.now());
      this.renderer.render(this.scene, this.camera);
      requestAnimationFrame(this.loop);
    }

    buildEnv() {
      const T = this.T;
      const pm = new T.PMREMGenerator(this.renderer);
      const env = new T.Scene();
      env.add(new T.Mesh(new T.BoxGeometry(20, 10, 30), new T.MeshBasicMaterial({ color: 0x0b0c10, side: T.BackSide })));
      const scr = new T.Mesh(new T.PlaneGeometry(12, 5), new T.MeshBasicMaterial({ color: 0x8ea4cc }));
      scr.position.set(0, 3, -14.9);
      env.add(scr);
      [-1, 1].forEach((sd) => {
        const w = new T.Mesh(new T.PlaneGeometry(6, 0.5), new T.MeshBasicMaterial({ color: 0x7a4a24 }));
        w.position.set(sd * 9.9, 2.5, 2);
        w.rotation.y = -sd * Math.PI / 2;
        env.add(w);
      });
      this.envRT = pm.fromScene(env, 0.04);
      pm.dispose();
    }

    /* ---------------- procedural textures ---------------- */
    canvasTex(w, h, draw, repeat, srgb) {
      const T = this.T;
      const c = document.createElement('canvas');
      c.width = w; c.height = h;
      draw(c.getContext('2d'), w, h);
      const t = new T.CanvasTexture(c);
      if (srgb !== false) t.colorSpace = T.SRGBColorSpace;
      t.wrapS = t.wrapT = T.RepeatWrapping;
      t.anisotropy = 8;
      if (repeat) t.repeat.set(repeat[0], repeat[1]);
      return t;
    }
    pixels(g, w, h, fn) {
      const img = g.createImageData(w, h);
      for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
        const v = clamp(fn(x, y), 0, 255), k = (y * w + x) * 4;
        img.data[k] = img.data[k + 1] = img.data[k + 2] = v; img.data[k + 3] = 255;
      }
      g.putImageData(img, 0, 0);
    }
    fabricTex() { return this.canvasTex(128, 128, (g, w, h) => this.pixels(g, w, h, (x, y) => 212 + (Math.random() - 0.5) * 46 - (x % 4 === 0 ? 26 : 0) - (y % 4 === 0 ? 16 : 0)), [4, 4]); }
    // one canvas per kind; each use is a clone with its own repeat
    cachedTex(key, make, repeat) {
      this.texCache = this.texCache || {};
      if (!this.texCache[key]) this.texCache[key] = make();
      const t = this.texCache[key].clone();
      if (repeat) t.repeat.set(repeat[0], repeat[1]);
      t.needsUpdate = true;
      return t;
    }
    carpetTex(r) { return this.cachedTex('carpet', () => this.canvasTex(256, 256, (g, w, h) => this.pixels(g, w, h, (x, y) => 200 + (Math.random() - 0.5) * 60 - (((x + y) % 24) < 2 ? 22 : 0) - (((x - y + 512) % 24) < 2 ? 22 : 0))), r); }
    wallTex(r) { return this.cachedTex('wall', () => this.canvasTex(128, 128, (g, w, h) => this.pixels(g, w, h, (x) => 205 + (Math.random() - 0.5) * 34 - ((x % 16) < 3 ? 46 : 0))), r); }
    glowTex() {
      return this.canvasTex(64, 64, (g) => {
        const r = g.createRadialGradient(32, 32, 0, 32, 32, 32);
        r.addColorStop(0, 'rgba(255,255,255,1)'); r.addColorStop(0.25, 'rgba(255,255,255,0.55)'); r.addColorStop(1, 'rgba(255,255,255,0)');
        g.fillStyle = r; g.fillRect(0, 0, 64, 64);
      });
    }
    blobTex() {
      return this.canvasTex(64, 64, (g) => {
        const r = g.createRadialGradient(32, 32, 4, 32, 32, 32);
        r.addColorStop(0, 'rgba(255,255,255,1)'); r.addColorStop(1, 'rgba(255,255,255,0)');
        g.fillStyle = r; g.fillRect(0, 0, 64, 64);
      }, null, false);
    }
    haloTex() {
      return this.canvasTex(256, 128, (g) => {
        g.shadowColor = 'rgba(190,210,255,1)'; g.shadowBlur = 40; g.fillStyle = '#fff';
        g.fillRect(42, 26, 172, 76);
        g.globalCompositeOperation = 'destination-out'; g.shadowBlur = 0;
        g.fillRect(42, 26, 172, 76);
      });
    }
    roundedBox(w, h, d, r, b) {
      const T = this.T;
      const W = Math.max(0.001, w - 2 * b), Hh = Math.max(0.001, h - 2 * b);
      const rr = Math.min(r, W / 2, Hh / 2), x0 = -W / 2, y0 = -Hh / 2;
      const s = new T.Shape();
      s.moveTo(x0 + rr, y0);
      s.lineTo(x0 + W - rr, y0); s.quadraticCurveTo(x0 + W, y0, x0 + W, y0 + rr);
      s.lineTo(x0 + W, y0 + Hh - rr); s.quadraticCurveTo(x0 + W, y0 + Hh, x0 + W - rr, y0 + Hh);
      s.lineTo(x0 + rr, y0 + Hh); s.quadraticCurveTo(x0, y0 + Hh, x0, y0 + Hh - rr);
      s.lineTo(x0, y0 + rr); s.quadraticCurveTo(x0, y0, x0 + rr, y0);
      const geo = new T.ExtrudeGeometry(s, { depth: Math.max(0.001, d - 2 * b), bevelEnabled: true, bevelThickness: b, bevelSize: b, bevelSegments: 1, curveSegments: 2 }); // hundreds of seats share it: keep it light
      geo.translate(0, 0, -(d - 2 * b) / 2);
      geo.computeVertexNormals();
      return geo;
    }

    /* ---------------- scene ---------------- */
    buildScene() {
      const T = this.T, scene = this.scene;
      const std = (color, extra) => new T.MeshStandardMaterial(Object.assign({ color: color, roughness: 0.9, metalness: 0 }, extra || {}));
      const glow = (color) => new T.MeshBasicMaterial({ color: color, toneMapped: false });
      const box = (w, h, d, mat, x, y, z) => { const m = new T.Mesh(new T.BoxGeometry(w, h, d), mat); m.position.set(x, y, z); m.receiveShadow = true; scene.add(m); return m; };
      const sw = H.screen.w, sh = L.screenH, curve = H.screen.curve || 0;
      const big = Math.max(L.HW * 2, L.backZ);
      scene.fog = new T.Fog(0x07080b, big * 2.2, big * 6);
      scene.environment = this.envRT.texture;
      const smallGlows = [], bigGlows = [];
      const addGlow = (list, x, y, z, c) => list.push({ x, y, z, c });

      // lights: the screen is the key light and casts the shadows
      scene.add(new T.HemisphereLight(0x8e9cbc, 0x0e0f13, 1.0));
      scene.add(new T.AmbientLight(0x404858, 0.25));
      const fill = new T.DirectionalLight(0xfff1e0, 0.45);
      fill.position.set(-6, 14, 22);
      scene.add(fill);
      const spot = new T.SpotLight(0xb4ccff, 140 * Math.pow(sw / 10, 1.6), 0, Math.PI * 0.42, 0.85, 2);
      spot.position.set(0, L.screenY, curve + 0.6);
      spot.target.position.set(0, 0, L.backZ * 0.6);
      spot.castShadow = true;
      spot.shadow.mapSize.set(QUALITY.SHADOW_MAP, QUALITY.SHADOW_MAP);
      spot.shadow.camera.near = 0.5;
      spot.shadow.camera.far = L.backZ * 1.8;
      spot.shadow.bias = -0.0005;
      spot.shadow.normalBias = 0.03;
      scene.add(spot, spot.target);
      this.screenLight = spot;
      this.screenLightBase = spot.intensity;
      [0.35, 0.78].forEach((f) => [-1, 1].forEach((side) => {
        const p = new T.PointLight(0xffa860, 7, 0, 2);
        p.position.set(side * (L.HW - 0.5), 2.4 + f * (L.depths - 1) * H.rise, f * L.backZ);
        scene.add(p);
      }));

      // room shell, seen from inside so the near walls drop away while orbiting
      const zFront = -1.0, roomD = L.backZ - zFront, roomH = L.hallHeight;
      const wallMat = std(0x2a2d37, { side: T.BackSide, map: this.wallTex([roomD / 0.9, roomH / 2.5]) });
      const room = new T.Mesh(new T.BoxGeometry(L.HW * 2, roomH, roomD), [
        wallMat, wallMat,
        std(0x0d0e12, { side: T.BackSide }),
        std(0x1d1f27, { side: T.BackSide, map: this.carpetTex([L.HW * 2 / 1.4, roomD / 1.4]) }),
        wallMat,
        std(0x0b0b0e, { side: T.BackSide })
      ]);
      room.position.set(0, roomH / 2, zFront + roomD / 2);
      room.receiveShadow = true;
      scene.add(room);

      const downMat = glow(0xffd9a8);
      for (let x = -L.HW + 2; x <= L.HW - 2; x += 3.2) for (let z = 3 + curve; z < L.backZ - 1; z += 3.2) {
        const d = new T.Mesh(new T.CircleGeometry(0.09, 16), downMat);
        d.rotation.x = Math.PI / 2;
        d.position.set(x, roomH - 0.02, z);
        scene.add(d);
        addGlow(bigGlows, x, roomH - 0.1, z, 0xffcf94);
      }

      const stageH = Math.min(0.6, H.screen.bottom - 0.1);
      box(L.HW * 2 - 0.02, stageH, 1.6, std(0x18191f, { map: this.carpetTex([L.HW * 2 / 1.4, 1.2]) }), 0, stageH / 2, zFront + 0.8);
      box(Math.min(sw + 1.2, L.HW * 2 - 0.4), 0.02, 0.03, glow(0x6f86b8), 0, stageH, zFront + 1.61);

      // raked rows
      const riserMat = std(0x262934, { map: this.carpetTex([L.HW * 2 / 1.4, 1]) });
      const nosingMat = std(0x34373f, { roughness: 0.5, metalness: 0.4 });
      for (let d = 1; d < L.depths; d++) {
        const zr = H.firstRow + d * H.rowDepth;
        const z0 = zr - H.rowDepth / 2;
        const z1 = d === L.depths - 1 ? L.backZ : zr + H.rowDepth / 2;
        const hgt = d * H.rise;
        box(L.HW * 2 - 0.02, hgt, z1 - z0, riserMat, 0, hgt / 2, (z0 + z1) / 2);
        box(L.HW * 2 - 0.02, 0.03, 0.05, nosingMat, 0, hgt - 0.012, z0 + 0.02);
      }
      const stepGlow = glow(0xffb36b);
      for (let d = 0; d < L.depths; d++) {
        const z0 = H.firstRow + d * H.rowDepth - H.rowDepth / 2;
        const hgt = d * H.rise;
        L.aisles.forEach((a) => {
          if (d > 0) box(a.w, 0.012, 0.025, stepGlow, a.x, hgt + 0.012, z0 + 0.025);
          const py = Math.max(0.05, hgt - H.rise / 2);
          box(0.07, 0.025, 0.012, stepGlow, a.x - a.w / 2 + 0.06, py, z0 + 0.005);
          addGlow(smallGlows, a.x - a.w / 2 + 0.06, py, z0 + 0.03, 0xffa45a);
        });
      }
      for (let x = -L.HW + 0.6; x <= L.HW - 0.6; x += 1.1) {
        const fz = H.firstRow - H.rowDepth / 2 - 0.4;
        box(0.06, 0.01, 0.06, glow(0xffa860), x, 0.006, fz);
        addGlow(smallGlows, x, 0.03, fz, 0xffa45a);
      }

      // side walls: acoustic panels, brass trim, sconces
      const panelMat = std(0x30333d, { roughness: 1, map: this.wallTex([1, 4]) });
      const trimMat = std(0x3b3326, { roughness: 0.35, metalness: 0.7 });
      const sconce = glow(0xffb070);
      const panelH = Math.min(roomH * 0.6, 7);
      for (let z = 0.6 + curve; z < L.backZ - 0.8; z += 1.7) {
        const floorHere = clamp(Math.floor((z - H.firstRow) / H.rowDepth + 0.5), 0, L.depths - 1) * H.rise;
        [-1, 1].forEach((side) => {
          box(0.08, panelH, 1.45, panelMat, side * (L.HW - 0.04), roomH * 0.55, z + 0.75);
          box(0.1, 0.03, 1.45, trimMat, side * (L.HW - 0.05), roomH * 0.55 - panelH / 2, z + 0.75);
          box(0.05, 0.22, 0.1, sconce, side * (L.HW - 0.1), floorHere + 2.3, z + 1.6);
          addGlow(bigGlows, side * (L.HW - 0.2), floorHere + 2.3, z + 1.6, 0xffa860);
        });
      }
      const backFloor = (L.depths - 1) * H.rise;
      [-1, 1].forEach((side) => {
        box(0.55, 0.2, 0.04, glow(0x37d67a), side * (L.HW - 0.8), backFloor + 2.5, L.backZ - 0.03);
        addGlow(bigGlows, side * (L.HW - 0.8), backFloor + 2.5, L.backZ - 0.15, 0x2fbf6a);
      });

      // screen, curved towards the seats by screen.curve
      const bend = (geo, w) => {
        const p = geo.attributes.position;
        for (let i = 0; i < p.count; i++) { const x = p.getX(i) / (w / 2); p.setZ(i, p.getZ(i) + curve * x * x); }
        p.needsUpdate = true;
        geo.computeVertexNormals();
        return geo;
      };
      const screenMat = new T.MeshBasicMaterial({ map: this.panoramaTexture(), color: 0xf2f2f2, toneMapped: false, side: T.DoubleSide });
      this.screenTex = screenMat.map;
      const screen = new T.Mesh(bend(new T.PlaneGeometry(sw, sh, 64, 1), sw), screenMat);
      screen.position.set(0, L.screenY, 0);
      scene.add(screen);
      if (H.image) this.loadFilmImage(screenMat, sw / sh);
      const maskW = Math.min(sw + 0.9, L.HW * 2 - 0.2);
      const mask = new T.Mesh(bend(new T.PlaneGeometry(maskW, sh + 0.7, 64, 1), sw), new T.MeshBasicMaterial({ color: 0x030303, side: T.DoubleSide }));
      mask.position.set(0, L.screenY + 0.1, -0.06);
      scene.add(mask);
      const halo = new T.Mesh(new T.PlaneGeometry(sw * 1.5, sh * 1.9), new T.MeshBasicMaterial({ map: this.haloTex(), transparent: true, opacity: 0.32, depthWrite: false, blending: T.AdditiveBlending, toneMapped: false }));
      halo.position.set(0, L.screenY, curve + 0.08);
      halo.renderOrder = 2;
      scene.add(halo);

      // projector window and beam
      const projY = roomH - 1.6;
      box(1.0, 0.45, 0.02, glow(0xbcd2ff), 0, projY, L.backZ - 0.02);
      addGlow(bigGlows, 0, projY, L.backZ - 0.2, 0x9fbcff);
      const apex = new T.Vector3(0, projY, L.backZ - 0.05);
      const c1 = new T.Vector3(-sw / 2, L.screenY - sh / 2, curve), c2 = new T.Vector3(sw / 2, L.screenY - sh / 2, curve);
      const c3 = new T.Vector3(sw / 2, L.screenY + sh / 2, curve), c4 = new T.Vector3(-sw / 2, L.screenY + sh / 2, curve);
      scene.add(new T.Mesh(new T.BufferGeometry().setFromPoints([apex, c1, c2, apex, c2, c3, apex, c3, c4, apex, c4, c1]),
        new T.MeshBasicMaterial({ color: 0x8fb4ff, transparent: true, opacity: 0.04, side: T.DoubleSide, depthWrite: false, blending: T.AdditiveBlending, toneMapped: false })));

      // light glows, one draw call per size
      const gTex = this.glowTex();
      [[smallGlows, 0.32], [bigGlows, 1.1]].forEach(([list, size]) => {
        if (!list.length) return;
        const pos = [], cols = [], col = new T.Color();
        list.forEach((g) => { pos.push(g.x, g.y, g.z); col.setHex(g.c); cols.push(col.r, col.g, col.b); });
        const geo = new T.BufferGeometry();
        geo.setAttribute('position', new T.Float32BufferAttribute(pos, 3));
        geo.setAttribute('color', new T.Float32BufferAttribute(cols, 3));
        const pts = new T.Points(geo, new T.PointsMaterial({ size: size, map: gTex, vertexColors: true, transparent: true, opacity: 0.8, depthWrite: false, blending: T.AdditiveBlending, toneMapped: false }));
        pts.frustumCulled = false;
        scene.add(pts);
      });

      this.buildSeats();

      // the picked seat: a line to the screen centre and the cone it sees
      const hg = new T.Group();
      hg.visible = false;
      scene.add(hg);
      this.helperGroup = hg;
      this.sight = new T.Line(new T.BufferGeometry(), new T.LineBasicMaterial({ color: COLORS.selected, transparent: true, opacity: 0.95, depthTest: false }));
      this.sight.renderOrder = 15;
      this.sight.frustumCulled = false;
      hg.add(this.sight);
      const coneGeo = new T.BufferGeometry();
      coneGeo.setAttribute('position', new T.Float32BufferAttribute(new Array(9).fill(0), 3));
      this.cone = new T.Mesh(coneGeo, new T.MeshBasicMaterial({ color: COLORS.selected, transparent: true, opacity: 0.09, side: T.DoubleSide, depthWrite: false, toneMapped: false }));
      this.cone.frustumCulled = false;
      hg.add(this.cone);
      const dot = new T.Mesh(new T.SphereGeometry(0.09 * Math.max(1, sw / 10), 16, 12), new T.MeshBasicMaterial({ color: COLORS.selected, depthTest: false, toneMapped: false }));
      dot.position.set(0, L.screenY, 0.02);
      dot.renderOrder = 16;
      hg.add(dot);
      this.marker = new T.Mesh(new T.ConeGeometry(0.16, 0.36, 20), new T.MeshBasicMaterial({ color: COLORS.selected, toneMapped: false }));
      this.marker.rotation.x = Math.PI;
      this.marker.visible = false;
      scene.add(this.marker);
      this.ring = new T.Mesh(new T.RingGeometry(0.34, 0.42, 40), new T.MeshBasicMaterial({ color: COLORS.selected, transparent: true, opacity: 0.6, side: T.DoubleSide, toneMapped: false }));
      this.ring.rotation.x = -Math.PI / 2;
      this.ring.visible = false;
      scene.add(this.ring);
      this.markerBase = 0;
      this.renderer.shadowMap.needsUpdate = true;
    }

    // Seats as instanced meshes; instance i of the cushion and back is seat i.
    buildSeats() {
      const T = this.T, scene = this.scene;
      const motion = !!H.motion, lift = motion ? 0.1 : 0, N = L.seats.length;
      const fabric = this.fabricTex();
      const seatMat = new T.MeshStandardMaterial({ color: 0xffffff, roughness: 0.96, map: fabric, bumpMap: fabric, bumpScale: 1.2 });
      const shellMat = new T.MeshStandardMaterial({ color: 0x1b1d23, roughness: 0.55, metalness: 0.15 });
      const armMat = new T.MeshStandardMaterial({ color: 0x2c2f37, roughness: 0.4, metalness: 0.25 });
      const baseMat = new T.MeshStandardMaterial({ color: 0x15161a, roughness: 0.35, metalness: 0.7 });
      const holderMat = new T.MeshStandardMaterial({ color: 0x3a3d45, roughness: 0.3, metalness: 0.8 });
      const parts = [
        { geo: this.roundedBox(0.47, 0.13, 0.47, 0.05, 0.03), mat: seatMat, at: [[0, 0.44 + lift, -0.03]] },
        { geo: this.roundedBox(0.47, motion ? 0.76 : 0.68, 0.11, 0.06, 0.03), mat: seatMat, at: [[0, (motion ? 0.89 : 0.85) + lift, 0.22]], rot: [0.14, 0, 0] },
        { geo: this.roundedBox(0.5, motion ? 0.8 : 0.72, 0.04, 0.05, 0.012), mat: shellMat, at: [[0, (motion ? 0.87 : 0.83) + lift, 0.285]], rot: [0.14, 0, 0] },
        { geo: this.roundedBox(0.045, 0.6, 0.52, 0.02, 0.012), mat: shellMat, at: [[-0.255, 0.3 + lift, 0], [0.255, 0.3 + lift, 0]] },
        { geo: this.roundedBox(0.075, 0.05, 0.52, 0.02, 0.015), mat: armMat, at: [[-0.255, 0.625 + lift, -0.01], [0.255, 0.625 + lift, -0.01]] },
        { geo: new T.TorusGeometry(0.038, 0.008, 4, 10), mat: holderMat, at: [[0.255, 0.652 + lift, -0.24]], rot: [Math.PI / 2, 0, 0] }
      ];
      if (motion) parts.push({ geo: this.roundedBox(0.5, 0.14, 0.64, 0.04, 0.02), mat: baseMat, at: [[0, 0.07, 0]] });
      const sz = motion ? 1.15 : 1;
      const sm = new T.Matrix4(), m = new T.Matrix4(), q = new T.Quaternion(), v = new T.Vector3(), sc = new T.Vector3(H.seatWidth / 0.55, 1, sz);
      parts.forEach((p) => {
        const locals = p.at.map((pos) => new T.Matrix4().compose(new T.Vector3(pos[0], pos[1], pos[2]), new T.Quaternion().setFromEuler(new T.Euler(...(p.rot || [0, 0, 0]))), new T.Vector3(1, 1, 1)));
        const mesh = new T.InstancedMesh(p.geo, p.mat, N * locals.length);
        let n = 0;
        L.seats.forEach((s) => {
          sm.compose(v.set(s.x, s.floor, s.z), q.identity(), sc);
          locals.forEach((loc) => { m.multiplyMatrices(sm, loc); mesh.setMatrixAt(n++, m); });
        });
        mesh.instanceMatrix.needsUpdate = true;
        mesh.castShadow = true;
        mesh.receiveShadow = true;
        mesh.computeBoundingSphere();
        scene.add(mesh);
        p.mesh = mesh;
      });
      this.cushMesh = parts[0].mesh;
      this.backMesh = parts[1].mesh;
      this.pickables = [this.cushMesh, this.backMesh];
      const blob = new T.InstancedMesh(new T.PlaneGeometry(1, 1).rotateX(-Math.PI / 2),
        new T.MeshBasicMaterial({ color: 0x000000, alphaMap: this.blobTex(), transparent: true, opacity: 0.6, depthWrite: false, polygonOffset: true, polygonOffsetFactor: -2 }), N);
      L.seats.forEach((s, i) => { m.compose(v.set(s.x, s.floor + 0.004, s.z + 0.04), q.identity(), new T.Vector3(H.seatWidth * 1.35, 1, 0.95 * sz)); blob.setMatrixAt(i, m); });
      blob.instanceMatrix.needsUpdate = true;
      blob.frustumCulled = false;
      scene.add(blob);
      this.paintSeats();
    }

    // Until the film's picture loads (or if there is none): a slow panorama.
    panoramaTexture() {
      const T = this.T;
      const W = 2048, Hh = Math.round(1024 / (H.screen.w / H.screen.h)), tau = Math.PI * 2 / W;
      const tex = this.canvasTex(W, Hh, (g) => {
        const sky = g.createLinearGradient(0, 0, 0, Hh);
        sky.addColorStop(0, '#0a1a36'); sky.addColorStop(0.45, '#33406e'); sky.addColorStop(0.72, '#d9845a'); sky.addColorStop(1, '#f3c27a');
        g.fillStyle = sky; g.fillRect(0, 0, W, Hh);
        g.fillStyle = 'rgba(255,255,255,0.7)';
        for (let i = 0; i < 140; i++) g.fillRect(Math.random() * W, Math.random() * Hh * 0.35, 1.5, 1.5);
        const sun = g.createRadialGradient(1300, Hh * 0.66, 0, 1300, Hh * 0.66, 170);
        sun.addColorStop(0, 'rgba(255,246,215,1)'); sun.addColorStop(0.2, 'rgba(255,214,150,0.9)'); sun.addColorStop(1, 'rgba(255,180,120,0)');
        g.fillStyle = sun; g.fillRect(0, 0, W, Hh);
        [['#3a2f52', 0.62, 44], ['#251f3b', 0.73, 32], ['#120f20', 0.86, 22]].forEach((Ly, li) => {
          g.fillStyle = Ly[0]; g.beginPath(); g.moveTo(0, Hh);
          for (let x = 0; x <= W; x += 6) g.lineTo(x, Hh * Ly[1] - Ly[2] * (Math.sin(x * tau * 3 + li * 2) + 0.5 * Math.sin(x * tau * 8 + li) + 0.22 * Math.sin(x * tau * 21 + li * 3)));
          g.lineTo(W, Hh); g.closePath(); g.fill();
        });
      });
      tex.repeat.set(0.5, 1);
      tex.wrapT = T.ClampToEdgeWrapping;
      return tex;
    }

    // The film's backdrop, cropped to fill the screen.
    loadFilmImage(mat, screenAspect) {
      const T = this.T;
      new T.TextureLoader().setCrossOrigin('anonymous').load(H.image, (tex) => {
        tex.colorSpace = T.SRGBColorSpace;
        tex.anisotropy = 8;
        const ia = tex.image.width / tex.image.height;
        if (ia > screenAspect) { tex.repeat.set(screenAspect / ia, 1); tex.offset.set((1 - screenAspect / ia) / 2, 0); }
        else { tex.repeat.set(1, ia / screenAspect); tex.offset.set(0, (1 - ia / screenAspect) / 2); }
        const old = mat.map;
        mat.map = tex;
        mat.needsUpdate = true;
        this.screenTex = null;
        if (old) old.dispose();
      }, undefined, () => { /* keep the panorama */ });
    }

    /* ---------------- seat map (2D) ---------------- */
    buildMap() {
      const mbox = $('mbox');
      mbox.style.aspectRatio = L.mapW.toFixed(2) + ' / ' + L.mapH.toFixed(2);
      const sc = $('mscreen');
      sc.style.left = ((L.HW - H.screen.w / 2) / L.mapW * 100) + '%';
      sc.style.top = (((H.screen.curve || 0) * 0.5 - L.mapZ0) / L.mapH * 100) + '%';
      sc.style.width = (H.screen.w / L.mapW * 100) + '%';
      $('mcone').setAttribute('viewBox', (-L.HW) + ' ' + L.mapZ0 + ' ' + L.mapW + ' ' + L.mapH);
      this.mapSeats = L.seats.map((s) => {
        const b = document.createElement('button');
        b.className = 'mseat';
        b.style.left = ((s.x + L.HW) / L.mapW * 100) + '%';
        b.style.top = ((s.z - L.mapZ0) / L.mapH * 100) + '%';
        b.style.width = (H.seatWidth * 0.78 / L.mapW * 100) + '%';
        b.style.height = (Math.min(0.5, H.rowDepth * 0.45) / L.mapH * 100) + '%';
        b.setAttribute('aria-label', this.seatName(s));
        b.addEventListener('click', () => this.select(s.i));
        mbox.appendChild(b);
        return b;
      });
    }

    seatName(s) { return TXT.row + ' ' + s.rowL + ' · ' + TXT.seat + ' ' + s.num; }

    /* ---------------- selection ---------------- */
    paintSeats() {
      if (!this.cushMesh) return;
      const col = this.tmpColor;
      L.seats.forEach((s) => {
        col.setHex(s.i === this.sel ? COLORS.selected : (s.i === this.hover ? COLORS.hover : COLORS.available));
        this.cushMesh.setColorAt(s.i, col);
        this.backMesh.setColorAt(s.i, col);
      });
      this.cushMesh.instanceColor.needsUpdate = true;
      this.backMesh.instanceColor.needsUpdate = true;
    }

    updateHelpers() {
      if (this.sel == null) return;
      const T = this.T, s = L.seats[this.sel];
      const eye = new T.Vector3(s.x, s.floor + EYE_HEIGHT, s.z);
      this.sight.geometry.dispose();
      this.sight.geometry = new T.BufferGeometry().setFromPoints([eye, new T.Vector3(0, L.screenY, 0)]);
      const pos = this.cone.geometry.attributes.position, cz = (H.screen.curve || 0) + 0.02;
      pos.setXYZ(0, eye.x, eye.y, eye.z);
      pos.setXYZ(1, -H.screen.w / 2, L.screenY, cz);
      pos.setXYZ(2, H.screen.w / 2, L.screenY, cz);
      pos.needsUpdate = true;
      this.cone.geometry.computeBoundingSphere();
      this.pipDirty = true;
      this.markerBase = s.floor + (H.motion ? 1.8 : 1.65);
      this.marker.position.set(s.x, this.markerBase, s.z + 0.1);
      this.ring.position.set(s.x, s.floor + 0.015, s.z);
    }

    select(i, ms) {
      const s = L.seats[i];
      if (!s) return;
      this.sel = i;
      this.paintSeats();
      this.updateHelpers();
      const dur = ms || VIEW.TWEEN_MS;
      if (this.mode === 'seat') this.flyToSeat(s, dur);
      else { const o = this.overviewFor(s); this.fly(o.pos, o.look, VIEW.OVERVIEW_FOV, 'orbit', dur); }
      send('seat', s.id);
      this.setState({ sel: i, mode: this.mode });
    }

    step(dr, ds) {
      if (this.sel == null) { this.select(H.best); return; }
      const cur = L.seats[this.sel];
      if (ds !== 0) {
        const row = L.byDepth[cur.depth];
        const k = row.indexOf(cur) + ds;
        if (k >= 0 && k < row.length) this.select(row[k].i, VIEW.STEP_MS);
        return;
      }
      for (let d = cur.depth + dr; d >= 0 && d < L.depths; d += dr) {
        let best = null;
        L.byDepth[d].forEach((s) => { if (!best || Math.abs(s.x - cur.x) < Math.abs(best.x - cur.x)) best = s; });
        if (best && Math.abs(best.x - cur.x) <= H.seatWidth * 3) { this.select(best.i, VIEW.STEP_MS); return; }
      }
    }

    enterSeat() {
      if (this.sel == null) return;
      this.flyToSeat(L.seats[this.sel], VIEW.TWEEN_MS);
      this.clearHover();
      this.setState({ mode: 'seat' });
    }
    exitSeat() {
      if (this.mode !== 'seat' || this.sel == null) return;
      const o = this.overviewFor(L.seats[this.sel]);
      this.fly(o.pos, o.look, VIEW.OVERVIEW_FOV, 'orbit', VIEW.TWEEN_MS);
      this.setState({ mode: 'orbit' });
    }
    toggleView() { if (this.mode === 'seat') this.exitSeat(); else this.enterSeat(); }

    /* ---------------- camera ---------------- */
    orbitPos(t, r, theta, phi) {
      return new this.T.Vector3(t.x + r * Math.sin(phi) * Math.sin(theta), t.y + r * Math.cos(phi), t.z + r * Math.sin(phi) * Math.cos(theta));
    }
    defaultView() {
      const aspect = this.size.w / this.size.h, big = Math.max(L.HW * 2, L.backZ);
      return { target: new this.T.Vector3(0, L.screenY * 0.45, L.backZ * 0.47), r: Math.min(130, big * 1.45 * Math.max(1, 0.95 / aspect)), theta: 0.62, phi: 0.95 };
    }
    overviewFor(seat) {
      const T = this.T, eyeY = seat.floor + EYE_HEIGHT;
      const look = new T.Vector3(seat.x * 0.45, (eyeY + L.screenY) * 0.4, seat.z * 0.5);
      const span = Math.max(Math.hypot(seat.x, seat.z), H.screen.w * 0.8);
      const aspect = this.size.w / this.size.h;
      const r = Math.min(130, (span * 1.05 + 9) * Math.max(1, 1.0 / aspect));
      return { pos: this.orbitPos(look, r, (seat.x < 0 ? -1 : 1) * 1.05, 0.82), look: look };
    }
    flyToSeat(s, ms) {
      this.fly(new this.T.Vector3(s.x, s.floor + EYE_HEIGHT, s.z), new this.T.Vector3(0, L.screenY, 0), VIEW.SEAT_FOV, 'seat', ms);
    }
    fly(pos, look, fov, mode, ms) {
      this.tween = { p0: this.camera.position.clone(), l0: this.look.clone(), f0: this.camera.fov, p1: pos.clone(), l1: look.clone(), f1: fov, t0: performance.now(), ms: ms, mode: mode };
      this.mode = mode;
    }
    syncFrom(mode) {
      const c = this.camera;
      if (mode === 'orbit') {
        const d = c.position.clone().sub(this.look), r = Math.max(0.001, d.length());
        this.orb.target.copy(this.look);
        this.orb.r = r;
        this.orb.phi = Math.acos(clamp(d.y / r, -1, 1));
        this.orb.theta = Math.atan2(d.x, d.z);
      } else {
        this.seatCam.eye.copy(c.position);
        const d = this.look.clone().sub(c.position).normalize();
        this.seatCam.pitch = Math.asin(clamp(d.y, -1, 1));
        this.seatCam.yaw = Math.atan2(d.x, -d.z);
        this.seatCam.baseYaw = this.seatCam.yaw;
      }
    }
    takeControl() {
      const tw = this.tween;
      if (!tw) return true;
      if (tw.mode === 'seat') return false;
      this.tween = null;
      this.fov = this.camera.fov;
      this.syncFrom('orbit');
      return true;
    }
    updateCamera(now) {
      const c = this.camera, tw = this.tween;
      if (tw) {
        const k = Math.min(1, (now - tw.t0) / tw.ms);
        const e = k < 0.5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2;
        c.position.lerpVectors(tw.p0, tw.p1, e);
        this.look.lerpVectors(tw.l0, tw.l1, e);
        c.fov = tw.f0 + (tw.f1 - tw.f0) * e;
        if (k >= 1) { this.tween = null; this.fov = tw.f1; this.syncFrom(tw.mode); }
      } else if (this.mode === 'orbit') {
        const o = this.orb;
        c.position.copy(this.orbitPos(o.target, o.r, o.theta, o.phi));
        this.look.copy(o.target);
        c.fov = this.fov;
      } else {
        const s = this.seatCam, cp = Math.cos(s.pitch);
        c.position.copy(s.eye);
        this.look.set(s.eye.x + Math.sin(s.yaw) * cp, s.eye.y + Math.sin(s.pitch), s.eye.z - Math.cos(s.yaw) * cp);
        c.fov = this.fov;
      }
      c.lookAt(this.look);
      c.updateProjectionMatrix();
    }
    zoomBy(f) {
      if (this.mode === 'orbit') this.orb.r = clamp(this.orb.r * f, 3.5, 130);
      else this.fov = clamp(this.fov * f, 25, 85);
    }
    pan(dx, dy) {
      const T = this.T, c = this.camera;
      const s = 2 * this.orb.r * Math.tan(c.fov * Math.PI / 360) / this.size.h;
      const right = new T.Vector3().setFromMatrixColumn(c.matrixWorld, 0);
      const up = new T.Vector3().setFromMatrixColumn(c.matrixWorld, 1);
      const t = this.orb.target;
      t.addScaledVector(right, -dx * s).addScaledVector(up, dy * s);
      t.set(clamp(t.x, -L.HW - 4, L.HW + 4), clamp(t.y, 0, L.hallHeight), clamp(t.z, -4, L.backZ + 4));
    }
    resize() {
      const w = Math.max(1, this.root.clientWidth), h = Math.max(1, this.root.clientHeight);
      this.size = { w: w, h: h };
      this.renderer.setSize(w, h, false);
      this.camera.aspect = w / h;
      // keep the action in the part of the screen the panels leave free
      const ox = w > 760 ? Math.round(Math.min(170, w * 0.12)) : 0;
      const oy = w > 760 ? 0 : Math.round(h * 0.16);
      this.camera.setViewOffset(w, h, ox, oy, w, h);
      this.camera.updateProjectionMatrix();
    }

    /* ---------------- input ---------------- */
    local(e) { const r = this.canvas.getBoundingClientRect(); return { x: e.clientX - r.left, y: e.clientY - r.top }; }
    pick(x, y) {
      this.ndc.set(x / this.size.w * 2 - 1, -(y / this.size.h) * 2 + 1);
      this.raycaster.setFromCamera(this.ndc, this.camera);
      const hit = this.raycaster.intersectObjects(this.pickables, false)[0];
      return hit && hit.instanceId != null ? hit.instanceId : null;
    }
    // For taps: the seat under the finger, else the nearest one within ~a
    // fingertip, since seats are only a few pixels wide in the overview.
    pickNear(x, y) {
      const hit = this.pick(x, y);
      if (hit != null) return hit;
      let best = null, bestD = 30 * 30;
      const v = this.tmp;
      L.seats.forEach((s) => {
        v.set(s.x, s.floor + 0.6, s.z).project(this.camera);
        if (v.z > 1) return;
        const dx = (v.x + 1) / 2 * this.size.w - x, dy = (1 - v.y) / 2 * this.size.h - y;
        const d = dx * dx + dy * dy;
        if (d < bestD) { bestD = d; best = s.i; }
      });
      return best;
    }
    hoverAt(x, y) {
      const hit = this.pick(x, y);
      if (hit === this.hover) return;
      this.hover = hit;
      this.paintSeats();
      this.canvas.style.cursor = hit == null ? 'grab' : 'pointer';
      if (hit == null) { this.setState({ hover: null }); return; }
      const s = L.seats[hit];
      const v = this.tmp.set(s.x, s.floor + 1.3, s.z).project(this.camera);
      this.setState({ hover: hit, tipX: Math.round((v.x + 1) / 2 * this.size.w), tipY: Math.round((1 - v.y) / 2 * this.size.h) });
    }
    clearHover() {
      if (this.hover == null) return;
      this.hover = null;
      this.paintSeats();
      this.setState({ hover: null });
    }
    pinchInfo() {
      const ps = Array.from(this.pointers.values());
      return {
        d: Math.max(1, Math.hypot(ps[0].x - ps[1].x, ps[0].y - ps[1].y)),
        a: Math.atan2(ps[1].y - ps[0].y, ps[1].x - ps[0].x),
        x: (ps[0].x + ps[1].x) / 2, y: (ps[0].y + ps[1].y) / 2
      };
    }
    onDown(e) {
      this.lastInput = performance.now();
      // A first finger starts a new touch: forget every other one. Inside the
      // app's web view a finger's lift can go missing, and a leftover finger
      // turned every later one-finger drag (orbit) into a pinch (zoom).
      if (e.isPrimary) { this.pointers.clear(); this.pinch = null; }
      try { this.canvas.setPointerCapture(e.pointerId); } catch (err) { /* ignore */ }
      const p = this.local(e);
      this.pointers.set(e.pointerId, p);
      if (this.pointers.size === 1) this.drag = { sx: p.x, sy: p.y, lx: p.x, ly: p.y, t: performance.now(), moved: false, button: e.button, pan: e.button === 2 || e.shiftKey };
      else if (this.pointers.size === 2) { if (this.drag) this.drag.moved = true; this.pinch = this.pinchInfo(); }
      if (e.pointerType === 'touch') this.clearHover();
    }
    onMove(e) {
      this.lastInput = performance.now();
      const p = this.local(e);
      if (!this.pointers.has(e.pointerId)) { if (e.pointerType === 'mouse') this.hoverAt(p.x, p.y); return; }
      this.pointers.set(e.pointerId, p);
      if (this.pointers.size >= 2 && this.pinch) {
        // Two fingers: pinch zooms; twisting them, or sliding both sideways,
        // turns the hall left/right; sliding both up/down tilts it.
        if (!this.takeControl()) return;
        const nw = this.pinchInfo();
        this.zoomBy(this.pinch.d / nw.d);
        let twist = nw.a - this.pinch.a;
        if (twist > Math.PI) twist -= 2 * Math.PI;
        if (twist < -Math.PI) twist += 2 * Math.PI;
        const dx = nw.x - this.pinch.x, dy = nw.y - this.pinch.y;
        if (this.mode === 'orbit') {
          this.orb.theta -= dx * 0.006 + twist;
          this.orb.phi = clamp(this.orb.phi - dy * 0.006, 0.12, 1.48);
        } else {
          const s = this.seatCam;
          s.yaw = clamp(s.yaw - dx * 0.0035 - twist * 0.6, s.baseYaw - 1.4, s.baseYaw + 1.4);
          s.pitch = clamp(s.pitch + dy * 0.0035, -0.9, 0.9);
        }
        this.pinch = nw;
        return;
      }
      const d = this.drag;
      if (!d) return;
      const dx = p.x - d.lx, dy = p.y - d.ly;
      d.lx = p.x; d.ly = p.y;
      if (!d.moved && Math.hypot(p.x - d.sx, p.y - d.sy) > (e.pointerType === 'mouse' ? 5 : 10)) { d.moved = true; this.clearHover(); }
      if (!d.moved || !this.takeControl()) return;
      if (this.mode === 'orbit') {
        if (d.pan) this.pan(dx, dy);
        else { this.orb.theta -= dx * 0.006; this.orb.phi = clamp(this.orb.phi - dy * 0.006, 0.12, 1.48); }
      } else {
        const s = this.seatCam;
        s.yaw = clamp(s.yaw - dx * 0.0035, s.baseYaw - 1.4, s.baseYaw + 1.4);
        s.pitch = clamp(s.pitch + dy * 0.0035, -0.9, 0.9);
      }
    }
    onUp(e) {
      const d = this.drag, single = this.pointers.size === 1;
      this.pointers.delete(e.pointerId);
      // the first finger up (or a cancel) ends the whole touch
      if (e.isPrimary || e.type === 'pointercancel') this.pointers.clear();
      if (this.pointers.size < 2) this.pinch = null;
      if (this.pointers.size === 0) {
        if (d && !d.moved && single && d.button === 0 && e.type === 'pointerup' && performance.now() - d.t < 800) {
          const p = this.local(e), hit = e.pointerType === 'mouse' ? this.pick(p.x, p.y) : this.pickNear(p.x, p.y);
          if (hit != null) this.select(hit);
        }
        this.drag = null;
      } else if (this.pointers.size === 1) {
        const p = Array.from(this.pointers.values())[0];
        this.drag = { sx: p.x, sy: p.y, lx: p.x, ly: p.y, t: 0, moved: true, button: 0, pan: false };
      }
    }
    onLeave(e) { if (!this.pointers.size && e.pointerType === 'mouse') this.clearHover(); }
    onWheel(e) { this.lastInput = performance.now(); e.preventDefault(); if (this.takeControl()) this.zoomBy(Math.exp(clamp(e.deltaY, -100, 100) * 0.0015)); }
    onKey(e) {
      const k = e.key;
      if (k === 'ArrowLeft') this.step(0, -1);
      else if (k === 'ArrowRight') this.step(0, 1);
      else if (k === 'ArrowUp') this.step(-1, 0);
      else if (k === 'ArrowDown') this.step(1, 0);
      else if (k === 'v' || k === 'V') this.toggleView();
      else if (k === 'Escape') this.exitSeat();
      else return;
      e.preventDefault();
    }

    /* ---------------- frame ---------------- */
    loop(now) {
      requestAnimationFrame(this.loop);
      // full speed while something moves; IDLE_FPS while the hall just sits there
      const busy = this.tween || this.pointers.size || now - (this.lastInput || 0) < 600;
      if (!busy && now - (this.lastFrame || 0) < 1000 / QUALITY.IDLE_FPS - 2) return;
      this.watchSpeed(now, busy);
      this.lastFrame = now;
      this.updateCamera(now);
      if (this.screenTex) this.screenTex.offset.x = (now * 0.000012) % 1;
      this.screenLight.intensity = this.screenLightBase * (0.9 + 0.06 * Math.sin(now * 0.0011) + 0.04 * Math.sin(now * 0.0037));
      const showHelpers = this.sel != null && this.mode === 'orbit';
      this.helperGroup.visible = showHelpers;
      this.marker.visible = showHelpers;
      this.ring.visible = this.sel != null;
      if (showHelpers) this.marker.position.y = this.markerBase + Math.sin(now * 0.004) * 0.06;
      const r = this.renderer;
      r.setScissorTest(false);
      r.setViewport(0, 0, this.size.w, this.size.h);
      r.render(this.scene, this.camera);
      this.renderPip(now);
    }
    // Over the first 60 moving frames: slower than ~38 fps on average means
    // 1x resolution from then on.
    watchSpeed(now, busy) {
      const p = this.perf || (this.perf = { n: 0, sum: 0, last: now, done: false });
      const dt = now - p.last;
      p.last = now;
      if (p.done || !busy || dt <= 0 || dt > 200) return;
      p.sum += dt;
      if (++p.n < 60) return;
      p.done = true;
      if (p.sum / p.n > 26 && this.renderer.getPixelRatio() > 1) {
        this.renderer.setPixelRatio(1);
        this.resize();
        this.pipDirty = true;
      }
    }
    renderPip(now) {
      if (this.sel == null || this.mode !== 'orbit') return;
      const el = $('pip');
      if (el.hidden) return;
      const pr = el.getBoundingClientRect();
      if (pr.width < 20 || pr.height < 20) return;
      const cr = this.canvas.getBoundingClientRect();
      const x = pr.left - cr.left + 1, y = cr.bottom - pr.bottom + 1, w = pr.width - 2, h = pr.height - 2;
      const T = this.T, r = this.renderer, dpr = r.getPixelRatio();
      const pw = Math.max(1, Math.round(w * dpr)), ph = Math.max(1, Math.round(h * dpr));
      if (!this.pipRT) {
        // the seat's view goes into a texture a few times a second; the
        // texture is pasted into the corner every frame
        this.pipRT = new T.WebGLRenderTarget(pw, ph, { samples: 4 });
        this.pipScene = new T.Scene();
        this.pipScene.add(new T.Mesh(new T.PlaneGeometry(2, 2), new T.MeshBasicMaterial({ map: this.pipRT.texture })));
        this.pipOrtho = new T.OrthographicCamera(-1, 1, 1, -1, 0, 1);
      }
      if (this.pipRT.width !== pw || this.pipRT.height !== ph) { this.pipRT.setSize(pw, ph); this.pipDirty = true; }
      if (this.pipDirty || now - (this.pipAt || 0) > QUALITY.PIP_REFRESH_MS) {
        const s = L.seats[this.sel], pc = this.pipCam;
        pc.position.set(s.x, s.floor + EYE_HEIGHT, s.z);
        pc.aspect = w / h;
        pc.lookAt(0, L.screenY, 0);
        pc.updateProjectionMatrix();
        this.helperGroup.visible = false;
        this.marker.visible = false;
        r.setRenderTarget(this.pipRT);
        r.render(this.scene, pc);
        r.setRenderTarget(null);
        this.pipAt = now;
        this.pipDirty = false;
      }
      r.setScissorTest(true);
      r.setScissor(x, y, w, h);
      r.setViewport(x, y, w, h);
      r.render(this.pipScene, this.pipOrtho);
      r.setScissorTest(false);
      r.setViewport(0, 0, this.size.w, this.size.h);
    }

    /* ---------------- panels ---------------- */
    render() {
      const st = this.state, sel = st.sel != null ? L.seats[st.sel] : null, isSeat = st.mode === 'seat';
      $('info').hidden = false;
      $('map').hidden = false;
      $('eyebrow').textContent = isSeat ? TXT.yourView : TXT.selected;
      $('title').textContent = sel ? this.seatName(sel) : '';
      const badge = $('badge');
      badge.hidden = !sel;
      if (sel) { badge.textContent = sel.rating; badge.style.color = TONE[sel.tone]; badge.style.borderColor = TONE[sel.tone]; }
      $('book').hidden = !TXT.book;
      $('bookT').textContent = TXT.book || '';
      $('viewT').textContent = isSeat ? TXT.overview : TXT.viewFrom;
      $('bestT').textContent = TXT.best;
      const pip = $('pip');
      pip.hidden = !sel || isSeat;
      if (sel) { $('pipLabel').textContent = TXT.viewFromShort + ' ' + sel.rowL + sel.num; $('pipCta').textContent = TXT.expand; }
      this.mapSeats.forEach((b, i) => { b.className = 'mseat' + (st.sel === i ? ' is-sel' : (st.hover === i ? ' is-hover' : '')); });
      $('mpoly').setAttribute('points', sel ? (sel.x + ',' + sel.z + ' ' + (-H.screen.w / 2) + ',' + (H.screen.curve || 0) + ' ' + (H.screen.w / 2) + ',' + (H.screen.curve || 0)) : '');
      const hov = st.hover != null ? L.seats[st.hover] : null;
      const tip = $('tip');
      tip.hidden = !hov;
      if (hov) {
        tip.style.left = st.tipX + 'px'; tip.style.top = st.tipY + 'px';
        $('tipT').textContent = this.seatName(hov);
        $('tipS').textContent = hov.rating;
      }
    }
  }

  window.setupHall = (json) => {
    if (H) return;
    H = typeof json === 'string' ? JSON.parse(json) : json;
    TXT = H.text || {};
    document.documentElement.lang = H.lang || 'ar';
    document.documentElement.dir = H.lang === 'en' ? 'ltr' : 'rtl';
    L = buildLayout(H);
    const app = new Explorer();
    try {
      app.init();
      app.render();
      send('ready');
    } catch (e) {
      $('loading').textContent = TXT.noGl || '';
      send('failed', String(e));
    }
  };
})();
</script>
</body>
</html>
