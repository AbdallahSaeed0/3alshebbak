name = "shebbak-cinema-fetch"
main = "worker.js"
compatibility_date = "2026-11-01"
workers_dev = true

# A Durable Object (Relay) was tried for Premiere and removed: v1 made it,
# v2 deletes it. Kept so later deploys don't replay the creation.
[[migrations]]
tag = "v1"
new_sqlite_classes = ["Relay"]

[[migrations]]
tag = "v2"
deleted_classes = ["Relay"]

# The app's catalog file (worker.js, catalog()).
[[kv_namespaces]]
binding = "CATALOG"
id = "f96fa9dfb57d48f38f01992bed9eaff6"
